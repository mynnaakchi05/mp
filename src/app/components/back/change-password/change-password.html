<div class="container py-4">
  <h2>Modifier le mot de passe</h2>
  <form [formRoot]="passwordForm" (submit)="onModifier()">
    <div class="mb-3">
      <label>Ancien mot de passe</label>
      <input type="password" class="form-control"  [formField]="passwordForm.ancienPassword">
    </div>
     <div class="mb-3">
      <label>Nouveau mot de passe</label>
       <input  type="password"  class="form-control" [formField]="passwordForm.nouveauPassword">
    </div>
     <div class="mb-3">
      <label>Confirmer le nouveau mot de passe</label>
       <input type="password" class="form-control" [formField]="passwordForm.confirmation">
    </div>
     @if(erreur()){
      <div class="alert alert-danger">{{erreur()}}</div>
    }
     @if(message()){
      <div class="alert alert-success">{{message()}}</div>
    }
     <button type="submit"  class="btn btn-primary" [disabled]="passwordForm().invalid()">
       Modifier
     </button>
   </form>
 </div>
