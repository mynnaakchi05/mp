
<div class="container py-5">

  <div class="text-center mb-4">

    <h1 class="titre fw-bold">Bienvenue chez TuniSanat</h1>

    <p class="text-secondary">
      Découvrez la beauté de l'artisanat tunisien.
      Des créations authentiques, faites avec passion.
    </p>

    <a mat-raised-button color="primary" routerLink="/boutique">
      Découvrir nos produits
    </a>

  </div>

  <!-- Carousel -->

  <div id="carouselTuniSanat" class="carousel slide"
       data-bs-ride="carousel" data-bs-interval="3000">

    <div class="carousel-inner rounded-4 shadow">

      <div class="carousel-item active">
        <img src="images/art1.jpeg" class="d-block w-100"
             alt="Table en zellige tunisien">
      </div>

      <div class="carousel-item">
        <img src="images/24.jpeg" class="d-block w-100"
             alt="Artisanat tunisien">
      </div>

      <div class="carousel-item">
        <img src="images/3.jpg" class="d-block w-100"
             alt="Création artisanale">
      </div>

    </div>

    <button class="carousel-control-prev" type="button"
            data-bs-target="#carouselTuniSanat" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button"
            data-bs-target="#carouselTuniSanat" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>

  </div>

</div>

<!-- Catégories -->

<div class="container mt-5">

  <h2 class="titre text-center fw-bold mb-4">
    Explorez nos catégories
  </h2>

  <div class="row g-4 justify-content-center">

    <div class="col-lg-3 col-md-4 col-sm-6">

      <mat-card class="h-100">
        <img mat-card-image src="images/gramophone.jpg"
             alt="Maison et décoration" class="image-categorie">

        <mat-card-content class="text-center">
          <br>
          <h5>Maison & Décoration</h5>
        </mat-card-content>
      </mat-card>

    </div>

    <div class="col-lg-3 col-md-4 col-sm-6">

      <mat-card class="h-100">
        <img mat-card-image src="images/panier-terroir.jpg"
             alt="Saveurs du terroir" class="image-categorie">

        <mat-card-content class="text-center">
          <br>
          <h5>Saveurs du Terroir</h5>
        </mat-card-content>
      </mat-card>

    </div>

    <div class="col-lg-3 col-md-4 col-sm-6">

      <mat-card class="h-100">
        <img mat-card-image src="images/sac-macrame.jpg"
             alt="Bijoux et créations" class="image-categorie">

        <mat-card-content class="text-center">
          <br>
          <h5>Bijoux & Créations</h5>
        </mat-card-content>
      </mat-card>

    </div>

    <div class="col-lg-3 col-md-4 col-sm-6">

      <mat-card class="h-100">
        <img mat-card-image src="images/7.jpg"
             alt="Lumières et bougies" class="image-categorie">

        <mat-card-content class="text-center">
          <br>
          <h5>Lumières & Bougies</h5>
        </mat-card-content>
      </mat-card>

    </div>

  </div>

</div>
