<div class="container py-5">
  <div class="text-center mb-5">
    <h1 class="titre fw-bold">À propos de {{siteInfo().nomSite}}</h1>
    <p class="text-secondary">
      Découvrez notre passion pour l'artisanat tunisien.
    </p>
  </div>
  <div class="row align-items-center g-4">
    <div class="col-md-6">
      <img src="images/art1.jpeg" class="img-fluid rounded-4 shadow" alt="Artisanat tunisien">
    </div>
    <div class="col-md-6">
      <h2 class="titre">Qui sommes-nous ?</h2>
      <p>{{siteInfo().description}}</p>
      <h3 class="titre mt-4">Notre objectif</h3>
      <p>{{siteInfo().objectif}}</p>
      <p>Createur : {{siteInfo().createur}}</p>
      <a routerLink="/boutique" class="btn btn-details mt-3">
        Découvrir nos produits
      </a>
    </div>
  </div>
</div>
