<div class="container boutique-container">
  <div class="boutique-header">
    <span class="subtitle">ARTISANAT TUNISIEN</span>
    <h1>Découvrez nos produits</h1>
    <p>Des créations authentiques, faites avec passion par nos artisans.</p>
  </div>

  <div class="search-container">
    <h4>Rechercher un produit</h4>
    <input type="text" class="form-control mb-3" placeholder="Nom du produit" #nom 
    [value]="nomRecherche()" (input)="nomRecherche.set(nom.value)">

    <input type="number" class="form-control mb-3" placeholder="Prix maximum en DT" #prix
      [value]="prixMax()" (input)="prixMax.set(prix.value)">

    <button class="clear-btn" (click)="effacerRecherche()">Effacer la recherche </button>
  </div>
  <p class="results-count">
    {{produitsFiltres().length}}produit(s) trouve(s)
  </p>
  <div class="row g-4">
    @for (p of produitsFiltres(); track p.id) {
      <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
        <app-product-card [produit]="p" />
      </div>
    } @empty {
      <div class="col-12 text-center">
        <p class="no-results">
          Aucun produit ne correspond à votre recherche.
        </p>
      </div>
    }
  </div>
</div>
